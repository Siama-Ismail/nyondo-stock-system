<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out - NYONDOStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    /* Strictly Following the Three-Color Palette */
    body {
      background-color: #0f172a !important; /* Navy */
      color: #ffffff !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .navbar {
      background-color: rgba(255, 255, 255, 0.03) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Glass Card Design */
    .card {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      color: white !important;
    }

    .nyondo-logo-text {
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .stock-logo-text {
      color: #f97316 !important; /* Orange */
      font-weight: 800;
    }

    /* High-contrast Action Button */
    .btn-orange {
      background-color: #f97316 !important;
      border: none !important;
      padding: 14px 30px;
      font-weight: 700;
      color: white !important;
      border-radius: 10px;
      transition: 0.3s;
    }

    .btn-orange:hover {
      background-color: #ea580c !important;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
    }

    .logout-icon-circle {
      width: 90px;
      height: 90px;
      background-color: rgba(249, 115, 22, 0.15);
      border: 2px solid #f97316;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 25px;
    }

    footer {
      background-color: transparent;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      padding: 1.5rem 0;
    }
  </style>
</head>
<body>

  <!-- Minimal Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container justify-content-center">
      <a class="navbar-brand" href="#">
        <span class="nyondo-logo-text">NYONDO</span><span class="stock-logo-text">STOCK</span>
      </a>
    </div>
  </nav>

  <!-- Logout Message -->
  <div class="main-content">
    <div class="card p-5 text-center">
      <div class="logout-icon-circle">
        <i class="bi bi-shield-check fs-1" style="color: #f97316;"></i>
      </div>
      
      <h2 class="fw-bold mb-3">Logged Out</h2>
      <p class="opacity-75 mb-5">Your session has been securely closed. Thank you for using the NYONDO Management System.</p>
      
      <a href="login.html" class="btn btn-orange shadow-sm">
        <i class="bi bi-lock-fill me-2"></i>RE-LOGIN
      </a>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-0 small">&copy; 2026 NYONDO General Hardware LTD. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
