<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NYONDOStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #0f172a !important; /* NYONDO Navy */
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: sans-serif;
    }

    .login-card {
      background: #ffffff !important;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .brand-title {
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      margin-bottom: 5px;
    }

    .brand-title span {
      color: #f97316; /* NYONDO Orange */
    }

    .form-label {
      color: #475569;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-control {
      border: 2px solid #e2e8f0;
      padding: 12px;
    }

    .form-control:focus {
      border-color: #f97316;
      box-shadow: none;
    }

    .btn-login {
      background-color: #f97316 !important;
      border: none !important;
      color: white !important;
      font-weight: 700;
      padding: 14px;
      width: 100%;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn-login:hover {
      background-color: #ea580c !important;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="brand-title">NYONDO<span>STOCK</span></h2>
    <p class="text-center text-muted small mb-4">Inventory Management System</p>

    <form action="dashboard.html">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="admin@nyondo.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-login">
        SIGN IN
      </button>

      <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small" style="color: #f97316;">Forgot Password?</a>
      </div>
    </form>

    <div class="footer-text">
      &copy; 2026 NYONDO General Hardware LTD
    </div>
  </div>

</body>
</html>
