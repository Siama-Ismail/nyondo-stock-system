<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Nyondostock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* BRAND COLORS - FIXED */
        :root {
            --brand-navy: #0f172a;
            --brand-orange: #f97316;
            --sidebar-hover: #1e293b;
            --light-bg: #f8fafc;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Sidebar Styling based on sales page.png */
        .sidebar {
            background-color: var(--brand-navy) !important;
            min-height: 100vh;
            position: fixed;
            padding: 0;
        }

        .brand-logo {
            color: var(--brand-orange) !important;
            font-weight: 800;
            font-size: 1.5rem;
            padding: 25px 20px;
            display: block;
            text-decoration: none;
            text-transform: capitalize;
        }

        .nav-link {
            color: #94a3b8 !important;
            padding: 15px 25px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background-color: var(--sidebar-hover);
            color: #ffffff !important;
        }

        .nav-link.active {
            background-color: var(--sidebar-hover);
            color: #ffffff !important;
            border-left: 4px solid var(--brand-orange);
        }

        /* Main Content */
        .main-content {
            margin-left: 16.666667%; /* Offset for col-md-2 */
            padding: 40px;
        }

        .section-card {
            background: #ffffff;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            color: var(--brand-navy);
            font-weight: 700;
            display: inline-block;
            border-bottom: 3px solid var(--brand-orange);
            padding-bottom: 5px;
            margin-bottom: 30px;
        }

        /* Form Controls */
        .form-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
        }

        .btn-add-sale {
            background-color: var(--brand-navy) !important;
            color: #ffffff !important;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 6px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-add-sale:hover {
            background-color: var(--brand-orange) !important;
        }

        /* Table Styling */
        .table thead th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar d-none d-md-block">
            <a href="#" class="brand-logo">Nyondo Stock</a>
            <div class="nav flex-column mt-2">
                <a class="nav-link" href="index.html">Dashboard</a>
                <a class="nav-link active" href="sales.html">Sales</a>
                <a class="nav-link" href="creditscheme.html">CreditScheme</a>
            </div>
           <a class="nav-link" href="logout.html">
  <span class="text-danger">
    <i class="bi bi-box-arrow-right me-2"></i>Logout
  </span>
</a>
        </nav>

        <!-- Content Area -->
        <main class="col-md-10 main-content">
            
            <!-- Record Sale Section -->
            <div class="section-card">
                <h5 class="section-title">Record Sale</h5>
                <form>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Item Name</label>
                            <select class="form-select">
                            <option>Cement iiN</option>
                            <option>Cement iiiN</option>
                            <option>Iron bars 10 mms</option>
                            <option>Iron bars 12 mms</option>
                            <option>Iron bars 16 mms</option>
                            <option>Nails inc 1</option> </option>
                            <option>Nails inc 2</option>
                            <option>Nails inc 3</option>
                            <option>Nails inc 4</option>
                            <option>Nails inc 5</option>
                            <option>Wheelbarrows</option>
                            <option>Wire mesh</option>
                            <option>Barbed wires</option>
                            <option>Iron sheets</option>
                        </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" placeholder="Enter quantity">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Unit Price (UGX)</label>
                            <input type="text" class="form-control" placeholder="Enter price">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" class="form-control" placeholder="Enter customer name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Customer Contact</label>
                            <input type="text" class="form-control" placeholder="Enter customer contact">
                        </div> 
                         <div class="col-md-4">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select">
                            <option>Cash</option>
                            <option>Mobile Money</option>
                            <option>Bank</option>
                        </select>
                        </div>
                        
                        <div class="col-md-6">
                        <label class="form-label">Delivery Distance (km)</label>
                        <input type="number" class="form-control" placeholder="Distance from Nansana">
                    </div>
                    </div>
                    <button type="submit" class="btn btn-add-sale mt-4">Add Sale</button>
                </form>
            </div>

            <!-- Sales Records Table -->
            <div class="section-card">
                <h4 class="fw-bold mb-4" style="color: var(--brand-navy);">Sales Records</h4>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Quantity</th>
                                <th>Unit Price (UGX)</th>
                                <th>Customer Name</th>
                                <th>Customer Contact</th>
                                <th>Payment Method</th>
                                 <th>Delivery Distance</th>
                                <th>Attendant</th>
                                <th>Date</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="text-muted small">
                                <td colspan="8" class="text-center py-4">No sales records found for today.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
