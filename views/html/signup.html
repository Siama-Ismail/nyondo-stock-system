<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Registration - NYONDO STOCK</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-navy: #0f172a;
      --charcoal: #1e293b;
      --accent-orange: #f97316;
      --light-bg: #f8fafc;
    }

    body { 
      background-color: var(--light-bg); 
      color: var(--charcoal); 
      font-family: 'Segoe UI', sans-serif; 
    }

    .registration-card {
      max-width: 500px;
      margin: 4rem auto;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
    }

    .card-header {
      background: var(--primary-navy) !important;
      border-bottom: 4px solid var(--accent-orange) !important;
      color: white;
      padding: 1.5rem;
    }

    .form-label { 
      font-weight: 600; 
      font-size: 0.85rem; 
      color: var(--primary-navy); 
      text-transform: uppercase;
    }

    .btn-nyondo {
      background: var(--accent-orange);
      color: white;
      font-weight: 700;
      border: none;
      padding: 0.8rem;
      letter-spacing: 1px;
    }

    .btn-nyondo:hover { 
      background: #ea580c; 
      color: white; 
    }
    
    .form-control:focus { 
      border-color: var(--accent-orange); 
      box-shadow: none; 
    }

    .staff-icon {
      font-size: 3rem;
      color: var(--accent-orange);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card registration-card">
      <div class="card-header text-center">
        <h4 class="mb-0 fw-bold">STAFF ONBOARDING</h4>
      </div>
      <div class="card-body p-4 p-md-5">
        <div class="text-center">
          <i class="bi bi-person-badge staff-icon"></i>
          <p class="text-muted small mb-4">Register a new employee account for the hardware management system.</p>
        </div>

        <form >
          
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Employee Name" required>
          </div>

          <div class="col-12">
            <label class="form-label">Staff Email</label>
            <input type="email" class="form-control" placeholder="name@nyondo.com" required>
          </div>

          <div class="col-12">
            <label class="form-label">Employee ID</label>
            <input type="text" class="form-control" placeholder="e.g. NY-2026-001" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" required minlength="8">
          </div>
          
          <div class="col-md-6">
            <label class="form-label">Confirm</label>
            <input type="password" class="form-control" required>
          </div>

          <div class="col-12 mt-4">
            <button type="submit" class="btn btn-nyondo w-100">REGISTER STAFF</button>
          </div>

          <div class="col-12 text-center mt-3">
            <a href="index.html" class="text-decoration-none small" style="color: var(--primary-navy)">
              <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('staffForm').addEventListener('submit', (e) => {
      if (!e.target.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
      }
      e.target.classList.add('was-validated');
    });
  </script>
</body>
</html>
